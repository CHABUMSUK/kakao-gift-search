name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ios/**'
      - '**.md'
      - 'notice.json'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: write

# 빌드가 동시에 돌면 서명 키가 서로 달라지므로 한 번에 하나씩
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  # 3일마다 서명 키 캐시를 한 번씩 읽어서 지워지지 않게 유지 (7일 동안 안 쓰면 깃허브가 지움)
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v2
      - run: ls -la ~/.android/ || true

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v2
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Check signing key file
        run: ls -la /home/runner/.android/ || true
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk giftsearch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: giftsearch-apk
          path: giftsearch.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: giftsearch-${{ github.run_number }}
          files: giftsearch.apk
          make_latest: true
