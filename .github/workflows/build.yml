name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ios/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v2
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Check signing key file
        run: ls -la /home/runner/.android/ || true
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk giftsearch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: giftsearch-apk
          path: giftsearch.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: giftsearch-${{ github.run_number }}
          files: giftsearch.apk
          make_latest: true
